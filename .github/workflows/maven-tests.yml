name: CI - Maven Tests

on:
  push:
    branches:
      - POC_APITests
    tags:
      - test_GA

  pull_request:
    branches:
      - POC_APITests

  # ✅ Allow manual trigger from any branch
  workflow_dispatch:
    inputs:
      test_group:
        description: 'TestNG group to run (e.g. integration, smoke). If empty runs default tests.'
        required: false
        default: ''

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    env:
      MAVEN_OPTS: -Xmx1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: '~\\.m2\\repository'
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile API tests (fast)
        run: mvn -B -DskipTests=true test-compile
        working-directory: tests/API

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore .NET packages for solutions
        run: |
          Write-Host "Restoring NuGet packages for Thermofisher.Opal.sln and OnPremAcquisition"
          dotnet restore "${{ github.workspace }}\Thermofisher.Opal.sln"
          dotnet restore "${{ github.workspace }}\src\utils\AcquisitionPOC\OnPremAcquisition\OnPremAcquisition.csproj"

      - name: Build and launch required servers (Thermofisher.Opal + OnPremAcquisition)
        run: |
          Write-Host "Building Thermofisher.Opal.sln and OnPremAcquisition.sln..."
          # Ensure dotnet SDK is available (setup-dotnet step is added below)
          Write-Host "Building Thermofisher.Opal.sln via 'msbuild.exe'"
          msbuild.exe "${{ github.workspace }}\Thermofisher.Opal.sln" /p:Configuration=Debug /m

          # Build and launch OnPremAcquisition (native .NET Framework exe)
          Push-Location "${{ github.workspace }}\src\utils\AcquisitionPOC\OnPremAcquisition"
          Write-Host "Building OnPremAcquisition.csproj via 'msbuild.exe'"
          msbuild.exe "${{ github.workspace }}\src\utils\AcquisitionPOC\OnPremAcquisition\OnPremAcquisition.csproj" /p:Configuration=Debug /m
          $onPremExe = "${{ github.workspace }}\src\utils\AcquisitionPOC\OnPremAcquisition\bin\Debug\net48\OnPremAcquisition.exe"
          if (Test-Path $onPremExe) {
              Write-Host "Starting OnPremAcquisition executable..."
              $proc = Start-Process -FilePath $onPremExe -PassThru -WindowStyle Hidden
              Write-Host "OnPremAcquisition PID=$($proc.Id)"
              # store pid for later shutdown
              echo "ONPREM_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
              Write-Host "OnPremAcquisition executable not found at $onPremExe"
          }
          Pop-Location


      - name: Wait for servers to become ready
        run: |
          Write-Host "Waiting briefly for servers to start..."
          Start-Sleep -Seconds 5
          # Optionally add health-checks here (curl / tcping)

      - name: Determine test group
        id: determine-group
        run: |
          Write-Host "GITHUB_REF=$env:GITHUB_REF"
          $INPUT_GROUP = "${{ github.event.inputs.test_group }}"
          if ($INPUT_GROUP) {
            Write-Host "Using workflow input test_group=$INPUT_GROUP"
            echo "TEST_GROUP=$INPUT_GROUP" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $TAG_NAME = $env:GITHUB_REF -replace "refs/tags/", ""
            Write-Host "Using git tag as test group: $TAG_NAME"
            echo "TEST_GROUP=$TAG_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "No test group specified; running default tests"
            echo "TEST_GROUP=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Run API tests
        run: |
          if ($env:TEST_GROUP) {
            Write-Host "Running tests for group: $env:TEST_GROUP"
            mvn -B -Dgroups="$env:TEST_GROUP" test
          } else {
            Write-Host "Running default test set"
            mvn -B test
          }
        working-directory: tests/API

      - name: Stop started servers (cleanup)
        if: always()
        run: |
          Write-Host "Stopping started servers..."
          if ($env:ONPREM_PID) {
            Write-Host "Killing OnPremAcquisition PID=$env:ONPREM_PID"
            Stop-Process -Id $env:ONPREM_PID -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "No OnPremAcquisition PID found in env"
          }

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/API/target/surefire-reports

      - name: Generate Allure Report
        if: always()
        run: |
          # Download Allure CLI if not cached
          if (!(Test-Path "allure-2.25.0")) {
            Write-Host "Downloading Allure CLI..."
            Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.zip" -OutFile "allure.zip"
            Expand-Archive -Path "allure.zip" -DestinationPath "." -Force
            Remove-Item "allure.zip"
          }
          
          # Generate Allure report from results
          Write-Host "Generating Allure report..."
          .\allure-2.25.0\bin\allure.bat generate tests/API/allure-results --clean -o allure-report
          
          # Create index.html redirect for easier navigation
          @"
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0; url=./index.html"></head>
          <body><a href="./index.html">View Allure Report</a></body>
          </html>
          "@ | Out-File -FilePath "allure-report/report.html" -Encoding UTF8

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Upload Allure Results (Raw Data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: tests/API/allure-results
          retention-days: 7

      - name: Publish test results (GitHub annotation)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Tests
          path: tests/API/target/surefire-reports/TEST-*.xml
          reporter: junit

  