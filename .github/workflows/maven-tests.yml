name: CI - Maven Tests

on:
  push:
    branches:
      - POC_APITests
    tags:
      - test_GA

  pull_request:
    branches:
      - POC_APITests

  # ✅ Allow manual trigger from any branch
  workflow_dispatch:
    inputs:
      test_group:
        description: 'TestNG group to run (e.g. integration, smoke). If empty runs default tests.'
        required: false
        default: ''

jobs:
  build-and-test:
    runs-on: THERMO-ML7H3GOI
    defaults:
      run:
        shell: powershell

    env:
      MAVEN_OPTS: -Xmx1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~\.m2\repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile API tests (fast)
        run: mvn -B -DskipTests=true test-compile
        working-directory: tests/API

      - name: Determine test group
        id: determine-group
        run: |
          Write-Host "GITHUB_REF=$env:GITHUB_REF"
          $INPUT_GROUP = "${{ github.event.inputs.test_group }}"
          if ($INPUT_GROUP) {
            Write-Host "Using workflow input test_group=$INPUT_GROUP"
            echo "TEST_GROUP=$INPUT_GROUP" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $TAG_NAME = $env:GITHUB_REF -replace "refs/tags/", ""
            Write-Host "Using git tag as test group: $TAG_NAME"
            echo "TEST_GROUP=$TAG_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "No test group specified; running default tests"
            echo "TEST_GROUP=" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Run API tests
        run: |
          if ($env:TEST_GROUP) {
            Write-Host "Running tests for group: $env:TEST_GROUP"
            mvn -B -Dgroups="$env:TEST_GROUP" test
          } else {
            Write-Host "Running default test set"
            mvn -B test
          }
        working-directory: tests/API

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/API/target/surefire-reports

      - name: Publish test results (GitHub annotation)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Tests
          path: tests/API/target/surefire-reports/TEST-*.xml
          reporter: junit
