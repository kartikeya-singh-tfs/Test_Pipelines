name: Run GRPC Tests and Generate Allure Report

on:
  workflow_dispatch: {}

jobs:
  grpc-tests:
    runs-on: APITestAgent
    defaults:
      run:
        shell: powershell

    env:
      MAVEN_OPTS: -Xmx1g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~\.m2\repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile API tests (fast)
        run: mvn -B -DskipTests=true test-compile
        working-directory: tests/API

      - name: Run only GRPC tests
        run: mvn -B -Dgroups=GRPC test
        working-directory: tests/API

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/API/target/surefire-reports

      - name: Generate Allure Report
        if: always()
        run: |
          # Download Allure CLI
          Write-Host "Downloading Allure CLI..."
          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.zip" -OutFile "allure.zip"
          Expand-Archive -Path "allure.zip" -DestinationPath "." -Force
          Remove-Item "allure.zip"

          # Generate the report
          Write-Host "Generating Allure report..."
          .\allure-2.25.0\bin\allure.bat generate tests/API/allure-results --clean -o allure-report || Write-Host "Allure generation failed"

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Upload Allure Results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: tests/API/allure-results
          retention-days: 7
